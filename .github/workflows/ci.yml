name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_gpu:
        description: "Run GPU job (lab runners only)"
        required: false
        default: "false"

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Release, RelWithDebInfo]
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
      - name: Configure
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DNR_BB_ENABLE_CUDA=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke bench + opt studies + orchestrator
        run: |
          ./build/nr_bb_bench
          ./build/nr_bb_opt_study
          ./build/nr_bb_orchestrator
          ./build/nr_bb_fuzz_fapi
      - name: Validate PHY independent adapters
        run: python3 ./scripts/validate_phy_independent.py
      - name: CUDA equivalence blocked harness
        run: |
          chmod +x ./scripts/cuda_equivalence.sh ./scripts/emit_blocked_gpu.sh
          NR_BB_BUILD_DIR=./build ./scripts/cuda_equivalence.sh || ./scripts/cuda_equivalence.sh
          ./scripts/emit_blocked_gpu.sh
          python3 ./scripts/validate_claim_boundaries.py
      - name: Gate6 dry-run fail-closed
        run: ./scripts/gate6_dry_run.sh

  gpu:
    if: github.event_name == 'workflow_dispatch' && inputs.run_gpu == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GPU pending
        run: |
          ./scripts/emit_pending_json.sh BLOCKED_GPU_RUNNER ci-gpu \
            results/benchmarks/ci_gpu.json \
            "Requires self-hosted NVIDIA runner (labels: self-hosted, nvidia-gpu)"
          cat results/benchmarks/ci_gpu.json
